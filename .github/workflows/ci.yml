name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap <lastmod> comes from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prerender, smoke test and vitals drive Google Chrome (preinstalled on ubuntu-latest) via playwright-core.
      - name: Check Chrome
        run: google-chrome --version
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Lint
        run: npm run lint
      - name: Contrast (WCAG AA tokens)
        run: npm run contrast
      - name: Unit tests
        run: npm test
      - name: Build (prod config) + prerender
        run: npm run build
      - name: Smoke test
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          npx --yes wait-on@8 -t 30000 http-get://127.0.0.1:4173/
          mkdir -p shots
          node scripts/smoke.mjs http://127.0.0.1:4173 shots desktop | tee smoke-desktop.txt
          node scripts/smoke.mjs http://127.0.0.1:4173 shots mobile | tee smoke-mobile.txt
          grep -q "SMOKE: OK" smoke-desktop.txt && grep -q "SMOKE: OK" smoke-mobile.txt
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: shots/
          retention-days: 7
